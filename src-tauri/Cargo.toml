[package]
name = "sermon-cut"
version = "0.5.0"
description = "AI-powered sermon video processing and thumbnail generation"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream", "form", "query"] }
base64 = "0.22"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures = "0.3"
md5 = "0.7"
sha2 = "0.10"
urlencoding = "2.1"
ort = "2.0.0-rc.15"
ndarray = "0.17"
image = { version = "0.25", features = ["jpeg", "png"] }
# Colour profiles (e.g. Display P3) to sRGB; image already depends on it.
moxcms = "0.7"
# Also the thumbnail pipeline's scratch folder for candidate frames.
tempfile = "3.14"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"
trash = "5"
unicode-normalization = "0.1"
tokio-util = "0.7"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Hooks for the smoke-test build. Only active together with debug_assertions,
# so a release build never contains them.
test-hooks = []

# Image work is unbearably slow unoptimised (a 24 MP crop takes seconds);
# optimise just these crates in dev and test builds.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
