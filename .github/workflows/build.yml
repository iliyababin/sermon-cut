name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build into (e.g. v0.5.0). The draft release is created for this tag.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    env:
      # Tag pushes use the pushed tag; manual runs use the required `tag` input.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Third-party actions are pinned to commit SHAs (tag or branch in the comment).
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # No install scripts run from the registry. None are needed: Vite's
      # bundler ships its platform binary as an optional package, and the
      # only other one (fsevents) ships prebuilt.
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      # Built on its own, with no secrets in the environment; tauri-action is
      # told not to rebuild it (beforeBuildCommand is emptied below).
      - name: Build frontend
        run: npm run build

      - name: Setup YouTube client secrets
        shell: bash
        env:
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRETS" > src-tauri/resources/youtube_client_secrets.json

      - name: Build Tauri app
        # Not v1: its latest.json links go through api.github.com, which is
        # rate limited, and install.sh falls back to latest.json exactly when
        # the API is unavailable.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Sermon Cut ${{ env.RELEASE_TAG }}'
          releaseBody: 'See the assets below to download for your platform.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config '{"build":{"beforeBuildCommand":""}}'

      - name: Remove YouTube client secrets
        if: always()
        shell: bash
        run: rm -f src-tauri/resources/youtube_client_secrets.json

      # SHA256SUMS.txt lets install.sh detect a truncated or corrupted download.
      # It is a corruption check, NOT a security guarantee: it lives in the same
      # release as the tarball, so anyone able to replace one can replace both.
      # The file is hashed as downloaded back from the release, so the line names
      # exactly the asset install.sh fetches (the glob also covers tauri-action v1,
      # which puts the version in the name, e.g. Sermon.Cut_0.5.0_aarch64.app.tar.gz).
      - name: Upload SHA256SUMS.txt (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*_aarch64.app.tar.gz' --dir "$dir"
          (cd "$dir" && shasum -a 256 -- *_aarch64.app.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" "$dir/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --clobber
